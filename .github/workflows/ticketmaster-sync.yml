name: Ticketmaster Turkey City Sync

on:
  push:
    branches: [bugun-codespaces-ready]
    paths:
      - ".github/workflows/ticketmaster-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sync-ticketmaster:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ticketmaster verilerini Türkiye şehirlerinden çek ve Supabase'e aktar
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          for secret_name in TICKETMASTER_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!secret_name:-}" ]; then
              echo "HATA: ${secret_name} secret bulunamadı."
              exit 1
            fi
          done

          NOW_UTC="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          END_UTC="$(date -u -d '+365 days' +"%Y-%m-%dT%H:%M:%SZ")"

          # Her etkinliğe kaynak tablosundaki Ticketmaster kaydını bağla.
          SOURCE_RESPONSE="$(curl --silent --show-error --fail-with-body \
            --get "${SUPABASE_URL%/}/rest/v1/sources" \
            --data-urlencode "select=id" \
            --data-urlencode "name=eq.Ticketmaster" \
            --data-urlencode "is_active=eq.true" \
            --data-urlencode "limit=1" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")"
          SOURCE_ID="$(printf '%s' "$SOURCE_RESPONSE" | jq -r '.[0].id // empty')"
          if [ -z "$SOURCE_ID" ]; then
            echo "HATA: Aktif Ticketmaster kaynak kaydı bulunamadı; etkinlikler aktarılmadı."
            exit 1
          fi

          mkdir -p city-events
          failures=0
          total=0

          # API aramalarında ASCII yazım, veritabanında uygulamanın 81 şehir
          # listesindeki Türkçe yazım kullanılır.
          while IFS='|' read -r API_CITY DB_CITY; do
            [ -n "$API_CITY" ] || continue
            echo "Etkinlikler aranıyor: $DB_CITY"

            rm -f "city-events/response-${API_CITY}-"*.json
            PAGE=0
            CITY_COUNT=0
            while [ "$PAGE" -lt 5 ]; do
              if ! curl --silent --show-error --fail-with-body \
                --get "https://app.ticketmaster.com/discovery/v2/events.json" \
                --data-urlencode "apikey=${TICKETMASTER_API_KEY}" \
                --data-urlencode "locale=*" \
                --data-urlencode "city=${API_CITY}" \
                --data-urlencode "countryCode=TR" \
                --data-urlencode "startDateTime=${NOW_UTC}" \
                --data-urlencode "endDateTime=${END_UTC}" \
                --data-urlencode "size=200" \
                --data-urlencode "page=${PAGE}" \
                --data-urlencode "sort=date,asc" \
                --output "city-events/response-${API_CITY}-${PAGE}.json"; then
                echo "UYARI: $DB_CITY sayfa $PAGE sorgusu başarısız."
                failures=$((failures + 1))
                break
              fi

              COUNT="$(jq '._embedded.events // [] | length' "city-events/response-${API_CITY}-${PAGE}.json")"
              echo "$DB_CITY sayfa $PAGE: $COUNT etkinlik"
              [ "$COUNT" -gt 0 ] || break
              CITY_COUNT=$((CITY_COUNT + COUNT))
              PAGE=$((PAGE + 1))
              sleep 0.2
            done

            if compgen -G "city-events/response-${API_CITY}-*.json" > /dev/null; then
              jq -s '[.[] | (._embedded.events // [])] | add // []' city-events/response-${API_CITY}-*.json > "city-events/combined-${API_CITY}.json"
            else
              echo "UYARI: $DB_CITY için yanıt dosyası oluşmadı."
              continue
            fi
            COUNT="$(jq 'length' "city-events/combined-${API_CITY}.json")"
            echo "$DB_CITY toplam bulunan kayıt: $COUNT"

            if [ "$COUNT" -gt 0 ]; then
              jq --arg syncedAt "$NOW_UTC" --arg city "$DB_CITY" --arg sourceId "$SOURCE_ID" '
                [
                  .[]
                  | select(.id != null and .name != null and .dates.start.dateTime != null)
                  | {
                      source_id: $sourceId,
                      external_id: .id,
                      external_source: "ticketmaster",
                      title: .name,
                      description: (.description // .pleaseNote // null),
                      category: (.classifications[0].segment.name // "Etkinlik"),
                      subcategory: (.classifications[0].genre.name // null),
                      city: $city,
                      starts_at: .dates.start.dateTime,
                      ends_at: (.dates.end.dateTime // null),
                      price_min: (.priceRanges[0].min // null),
                      price_max: (.priceRanges[0].max // null),
                      ticket_url: (.url // null),
                      source_url: (.url // null),
                      image_url: ((.images // [])[0].url // null),
                      venue_name: ((._embedded.venues // [])[0].name // null),
                      venue_address: ([
                        (._embedded.venues // [])[0].address.line1 // null,
                        (._embedded.venues // [])[0].postalCode // null,
                        (._embedded.venues // [])[0].city.name // null
                      ] | map(select(. != null and . != "")) | join(", ")),
                      latitude: ((._embedded.venues // [])[0].location.latitude // null),
                      longitude: ((._embedded.venues // [])[0].location.longitude // null),
                      trust_score: 95,
                      popularity_score: 0,
                      recommendation_score: 0,
                      is_active: true,
                      last_synced_at: $syncedAt
                    }
                ]
              ' "city-events/combined-${API_CITY}.json" > "city-events/events-${API_CITY}.json"
              total=$((total + $(jq 'length' "city-events/events-${API_CITY}.json")))
            fi
            sleep 1
          done <<'CITIES'
          Adana|Adana
          Adiyaman|Adıyaman
          Afyonkarahisar|Afyonkarahisar
          Agri|Ağrı
          Amasya|Amasya
          Ankara|Ankara
          Antalya|Antalya
          Artvin|Artvin
          Aydin|Aydın
          Balikesir|Balıkesir
          Bilecik|Bilecik
          Bingol|Bingöl
          Bitlis|Bitlis
          Bolu|Bolu
          Burdur|Burdur
          Bursa|Bursa
          Canakkale|Çanakkale
          Cankiri|Çankırı
          Corum|Çorum
          Denizli|Denizli
          Diyarbakir|Diyarbakır
          Edirne|Edirne
          Elazig|Elazığ
          Erzincan|Erzincan
          Erzurum|Erzurum
          Eskisehir|Eskişehir
          Gaziantep|Gaziantep
          Giresun|Giresun
          Gumushane|Gümüşhane
          Hakkari|Hakkâri
          Hatay|Hatay
          Isparta|Isparta
          Mersin|Mersin
          Istanbul|İstanbul
          Izmir|İzmir
          Kars|Kars
          Kastamonu|Kastamonu
          Kayseri|Kayseri
          Kirklareli|Kırklareli
          Kırşehir|Kırşehir
          Kocaeli|Kocaeli
          Konya|Konya
          Kutahya|Kütahya
          Malatya|Malatya
          Manisa|Manisa
          Kahramanmaras|Kahramanmaraş
          Mardin|Mardin
          Mugla|Muğla
          Mus|Muş
          Nevsehir|Nevşehir
          Nigde|Niğde
          Ordu|Ordu
          Rize|Rize
          Sakarya|Sakarya
          Samsun|Samsun
          Siirt|Siirt
          Sinop|Sinop
          Sivas|Sivas
          Tekirdag|Tekirdağ
          Tokat|Tokat
          Trabzon|Trabzon
          Tunceli|Tunceli
          Sanliurfa|Şanlıurfa
          Usak|Uşak
          Van|Van
          Yozgat|Yozgat
          Zonguldak|Zonguldak
          Aksaray|Aksaray
          Bayburt|Bayburt
          Karaman|Karaman
          Kirikkale|Kırıkkale
          Batman|Batman
          Sirnak|Şırnak
          Bartin|Bartın
          Ardahan|Ardahan
          Igdir|Iğdır
          Yalova|Yalova
          Karabuk|Karabük
          Kilis|Kilis
          Osmaniye|Osmaniye
          Duzce|Düzce
          CITIES

          shoptotal=0
          if compgen -G "city-events/events-*.json" > /dev/null; then
            jq -s 'add' city-events/events-*.json > city-events/all-events.json
            shoptotal="$(jq 'length' city-events/all-events.json)"
          else
            echo "Ticketmaster bu çalışmada aktarılabilir etkinlik döndürmedi."
            exit 0
          fi

          echo "Toplam hazırlanmış kayıt: $shoptotal (şehir sorgularındaki toplam: $total)"
          if [ "$shoptotal" -eq 0 ]; then
            echo "Aktarılacak etkinlik bulunamadı."
            exit 0
          fi

          HTTP_STATUS="$(
            curl --silent --show-error \
              --output city-events/supabase-response.json \
              --write-out "%{http_code}" \
              --request POST \
              "${SUPABASE_URL}/rest/v1/events?on_conflict=external_source,external_id" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --header "Prefer: resolution=merge-duplicates,return=minimal" \
              --data-binary @city-events/all-events.json
          )"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "HATA: Supabase HTTP durum kodu: $HTTP_STATUS"
            cat city-events/supabase-response.json
            exit 1
          fi

          echo "Supabase aktarımı başarılı. HTTP $HTTP_STATUS"
          if [ "$failures" -gt 0 ]; then
            echo "UYARI: $failures şehir sorgusu başarısız oldu; kalan şehirler işlendi."
          fi
          echo "Türkiye şehirleri Ticketmaster senkronizasyonu tamamlandı."
