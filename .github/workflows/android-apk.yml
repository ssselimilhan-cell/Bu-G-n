name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - bugun-codespaces-ready

concurrency:
  group: bugun-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test public account deletion page
        shell: bash
        run: |
          set -euo pipefail
          url="https://yvshqvethzbwcgpqaptd.supabase.co/functions/v1/account-deletion-page"
          curl --retry 3 --retry-delay 2 --silent --show-error --fail "$url" --output "$RUNNER_TEMP/account-deletion.html"
          grep -q '<title>BUGÜN – Hesap ve Veri Silme</title>' "$RUNNER_TEMP/account-deletion.html"
          grep -q 'Doğrulama bağlantısı gönder' "$RUNNER_TEMP/account-deletion.html"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST "$url")"
          if [ "$status" != "405" ]; then
            echo "::error::Account deletion page should reject POST requests; got HTTP $status"
            exit 1
          fi
          echo "Account deletion page responds with the expected HTML and rejects POST."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-pub

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bugun-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
