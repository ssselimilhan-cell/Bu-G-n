name: BUGUN City Places Collector

on:
  push:
    branches: [bugun-codespaces-ready]
    paths:
      - ".github/workflows/collect-city-places.yml"
      - "scripts/collectors/openstreetmap_city_places.py"
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

concurrency:
  group: bugun-city-places
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector dependencies
        run: python -m pip install requests
      - name: Collect parks museums zoos and attractions for Turkish cities
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/collectors/openstreetmap_city_places.py
